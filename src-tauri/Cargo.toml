[package]
name = "lumen"
version = "0.1.0"
description = "Local-first Personal Growth Operating System"
authors = ["Lumen owner"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "=1.27.0", features = ["v4"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
sha2 = "=0.10.9"
fs2 = "0.4"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.5.1"
jieba-rs = "=0.7.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "Media_Control", "Win32_System_WinRT"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

# Keep Windows LLVM debug links within local memory limits; dependencies retain their profile.
[profile.dev.package.lumen]
debug = 0
codegen-units = 1

# Generated Windows bindings do not need full PDB data for application tests.
# Keep their debug metadata bounded on the Windows reference build host.
[profile.dev.package.windows]
debug = 0

# GTK 0.18 is required by Tauri's Linux dependency graph. Minimal upstream UB fix.
[patch.crates-io]
glib = { path = "vendor/glib" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"
